name = "telegram-ai-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Every minute: checks for due reminders / recurring tasks (1 KV read per run, well inside the free plan).
[triggers]
crons = ["* * * * *"]

# Any OpenAI-compatible provider. Check the provider's model list; free model names change often.
[vars]
LLM_BASE_URL = "https://api.groq.com/openai/v1"
LLM_MODEL = "llama-3.3-70b-versatile"
TIMEZONE = "Asia/Kolkata" # used for "kal subah 8 baje"; change to your IANA timezone
# TOOLS = "remember,forget,set_reminder,list_reminders,cancel_reminder,fetch_url"  # uncomment to restrict what the bot may do

# Memory + scheduled tasks. Create with: npx wrangler kv namespace create CHAT  (paste the id below)
[[kv_namespaces]]
binding = "CHAT"
id = "REPLACE_WITH_KV_ID"

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, LLM_API_KEY, ALLOWED_USER_IDS
