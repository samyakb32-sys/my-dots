name = "telegram-ai-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Every minute: checks for due reminders / recurring tasks (1 KV read per run, well inside the free plan).
[triggers]
crons = ["* * * * *"]

# Cloudflare Workers AI (free daily allowance, then calls fail instead of billing on the free plan).
# Used for: voice notes (fallback), reading PDF/Word/Excel files, and the image generator. Remove if unwanted.
[ai]
binding = "AI"

[vars]
# Models are tried in this order; if one is rate-limited, down or slow, the next answers.
# Names are short names from src/models.js (PRESETS) or provider:model-id. Providers without an API key are skipped.
MODEL_CHAIN = "gpt-oss,deepseek,glm,llama,nemotron,free"
# VISION_CHAIN = "gemini,llama-vision"  # models for photos (default shown)
TIMEZONE = "Asia/Kolkata" # used for "kal subah 8 baje"; change to your IANA timezone

# Boundaries. TOOLS limits what the bot may use (comma list, trailing * allowed, e.g. "web_search,remember,github__*").
# AUTO_APPROVE lists risky tools that may run WITHOUT asking you first (default: none).
# TOOLS = "remember,forget,set_reminder,list_reminders,cancel_reminder,fetch_url,web_search,run_code,generate_image,send_file"
# AUTO_APPROVE = ""
# JUDGE0_URL = "https://ce.judge0.com"   # code runner; point at your own Judge0 for heavier use
# JINA_FALLBACK = "0"                    # "0" stops fetch_url from using r.jina.ai to render JavaScript pages
# WATCH_MIN_MINUTES = "30"               # page watcher: minimum minutes between checks (each check is one KV write; floor 10)
# BROWSER_WORKER_URL = "https://your-tunnel.example.com"  # optional real browser (README "Real browser"); https only.
#                                        # The matching secret is BROWSER_WORKER_TOKEN.

# Memory + scheduled tasks + approvals. Create with: npx wrangler kv namespace create CHAT  (paste the id below)
[[kv_namespaces]]
binding = "CHAT"
id = "REPLACE_WITH_KV_ID"

# Approval decisions: exactly one tap per approval wins even if buttons are pressed twice at once (KV can't do that).
# Works on the free plan (SQLite-backed Durable Object); `wrangler deploy` creates it. Delete both blocks to fall back
# to a best-effort KV claim.
[[durable_objects.bindings]]
name = "APPROVAL_LOCK"
class_name = "ApprovalLock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ApprovalLock"]

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, ALLOWED_USER_IDS
#   plus the key of every model provider you want (any subset, at least one):
#     NVIDIA_API_KEY, GROQ_API_KEY, OPENROUTER_API_KEY, GEMINI_API_KEY, CEREBRAS_API_KEY
#   optional:
#     TAVILY_API_KEY or BRAVE_API_KEY  (web search; Tavily also works without a key)
#     MCP_SERVERS                      (JSON list of apps: GitHub, Zapier -> Gmail/Calendar..., see README)
#     BROWSER_WORKER_TOKEN             (bearer token of your browser worker, see README)
